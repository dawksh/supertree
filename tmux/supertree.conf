# supertree bindings — sourced from ~/.tmux.conf
# Only uses keys the base config leaves free (M-arrows and S-Enter stay as-is).
# Each binding records its action for the bottom bar; it clears itself after 3s
# unless a newer shortcut replaced it.

bind -n M-w set -g @st_last_key 'worktrees' \; run-shell -b -d 3 -C "if -F '##{==:##{@st_last_key},worktrees}' 'set -gu @st_last_key'" \; run-shell -b -c '#{pane_current_path}' "~/.local/bin/st go --popup '#{client_tty}'"
bind -n M-e set -g @st_last_key 'toggle' \; run-shell -b -d 3 -C "if -F '##{==:##{@st_last_key},toggle}' 'set -gu @st_last_key'" \; run-shell -b "~/.local/bin/st toggle"
bind -n M-Tab set -g @st_last_key 'last tree' \; run-shell -b -d 3 -C "if -F '##{==:##{@st_last_key},last tree}' 'set -gu @st_last_key'" \; run-shell -b "~/.local/bin/st last"
bind -n M-r set -g @st_last_key 'roots' \; run-shell -b -d 3 -C "if -F '##{==:##{@st_last_key},roots}' 'set -gu @st_last_key'" \; run-shell -b -c '#{pane_current_path}' "~/.local/bin/st roots --popup '#{client_tty}'"

# configurable window slots; base-index stays whatever you had
bind -n M-1 set -g @st_last_key 'tab 1' \; run-shell -b -d 3 -C "if -F '##{==:##{@st_last_key},tab 1}' 'set -gu @st_last_key'" \; run-shell -b "~/.local/bin/st window 1"
bind -n M-2 set -g @st_last_key 'tab 2' \; run-shell -b -d 3 -C "if -F '##{==:##{@st_last_key},tab 2}' 'set -gu @st_last_key'" \; run-shell -b "~/.local/bin/st window 2"
bind -n M-3 set -g @st_last_key 'tab 3' \; run-shell -b -d 3 -C "if -F '##{==:##{@st_last_key},tab 3}' 'set -gu @st_last_key'" \; run-shell -b "~/.local/bin/st window 3"
bind -n M-4 set -g @st_last_key 'tab 4' \; run-shell -b -d 3 -C "if -F '##{==:##{@st_last_key},tab 4}' 'set -gu @st_last_key'" \; run-shell -b "~/.local/bin/st window 4"
bind -n M-5 set -g @st_last_key 'tab 5' \; run-shell -b -d 3 -C "if -F '##{==:##{@st_last_key},tab 5}' 'set -gu @st_last_key'" \; run-shell -b "~/.local/bin/st window 5"
bind -n M-6 set -g @st_last_key 'tab 6' \; run-shell -b -d 3 -C "if -F '##{==:##{@st_last_key},tab 6}' 'set -gu @st_last_key'" \; run-shell -b "~/.local/bin/st window 6"
bind -n M-7 set -g @st_last_key 'tab 7' \; run-shell -b -d 3 -C "if -F '##{==:##{@st_last_key},tab 7}' 'set -gu @st_last_key'" \; run-shell -b "~/.local/bin/st window 7"
bind -n M-8 set -g @st_last_key 'tab 8' \; run-shell -b -d 3 -C "if -F '##{==:##{@st_last_key},tab 8}' 'set -gu @st_last_key'" \; run-shell -b "~/.local/bin/st window 8"
bind -n M-9 set -g @st_last_key 'tab 9' \; run-shell -b -d 3 -C "if -F '##{==:##{@st_last_key},tab 9}' 'set -gu @st_last_key'" \; run-shell -b "~/.local/bin/st window 9"
bind -n M-n set -g @st_last_key 'next tab' \; run-shell -b -d 3 -C "if -F '##{==:##{@st_last_key},next tab}' 'set -gu @st_last_key'" \; next-window
bind -n M-p set -g @st_last_key 'prev tab' \; run-shell -b -d 3 -C "if -F '##{==:##{@st_last_key},prev tab}' 'set -gu @st_last_key'" \; previous-window

# sidebar: M-s focuses it, M-B (Option-Shift-B) hides/shows it everywhere
bind -n M-s set -g @st_last_key 'sidebar' \; run-shell -b -d 3 -C "if -F '##{==:##{@st_last_key},sidebar}' 'set -gu @st_last_key'" \; run-shell -b "~/.local/bin/st _sidebar-focus"
bind -n M-B set -g @st_last_key 'sidebar toggle' \; run-shell -b -d 3 -C "if -F '##{==:##{@st_last_key},sidebar toggle}' 'set -gu @st_last_key'" \; run-shell -b "~/.local/bin/st _sidebar-toggle"
# left / right between panes; many macOS terminals turn Option-arrows into word jumps
bind -n M-h set -g @st_last_key 'pane left' \; run-shell -b -d 3 -C "if -F '##{==:##{@st_last_key},pane left}' 'set -gu @st_last_key'" \; select-pane -L
bind -n M-l set -g @st_last_key 'pane right' \; run-shell -b -d 3 -C "if -F '##{==:##{@st_last_key},pane right}' 'set -gu @st_last_key'" \; select-pane -R
# close the focused pane after a y/n prompt; ignored on the sidebar (M-B hides that).
# A pane shown from another tree, or the holder it left there, goes back instead of closing.
bind -n M-x set -g @st_last_key 'close pane' \; run-shell -b -d 3 -C "if -F '##{==:##{@st_last_key},close pane}' 'set -gu @st_last_key'" \; if-shell -F '#{==:#{@st_sidebar},1}' '' { if-shell -F '#{||:#{@st_home_pane},#{@st_lent_pane}}' { run-shell -b "~/.local/bin/st _split-return '#{pane_id}'" } { confirm-before -p "close pane? (y/n)" kill-pane } }
# split side by side or stacked: another copy of this tab, or tabs from another open tree
bind -n M-v set -g @st_last_key 'split' \; run-shell -b -d 3 -C "if -F '##{==:##{@st_last_key},split}' 'set -gu @st_last_key'" \; run-shell -b "~/.local/bin/st split"
bind -n M-V set -g @st_last_key 'split stacked' \; run-shell -b -d 3 -C "if -F '##{==:##{@st_last_key},split stacked}' 'set -gu @st_last_key'" \; run-shell -b "~/.local/bin/st split --vertical"
# next / previous open tree, in sidebar order
bind -n M-j set -g @st_last_key 'next tree' \; run-shell -b -d 3 -C "if -F '##{==:##{@st_last_key},next tree}' 'set -gu @st_last_key'" \; run-shell "~/.local/bin/st _tree-next"
bind -n M-k set -g @st_last_key 'prev tree' \; run-shell -b -d 3 -C "if -F '##{==:##{@st_last_key},prev tree}' 'set -gu @st_last_key'" \; run-shell "~/.local/bin/st _tree-prev"

bind -n M-/ set -g @st_last_key 'keys' \; run-shell -b -d 3 -C "if -F '##{==:##{@st_last_key},keys}' 'set -gu @st_last_key'" \; display-popup -EE -w 82 -h 30 -T ' Keys ' "~/.local/bin/st keys --wait"

# which worktree am I typing into
set -g status-left ' #{?@supertree_label,#{@supertree_label},#S} '
set -g status-left-length 60

# M-q and M-Q detach; tree sessions keep running
bind -n M-q set -g @st_last_key 'leave' \; run-shell -b -d 3 -C "if -F '##{==:##{@st_last_key},leave}' 'set -gu @st_last_key'" \; run-shell -b "~/.local/bin/st leave '#{client_tty}'"
bind -n M-Q set -g @st_last_key 'detach' \; run-shell -b -d 3 -C "if -F '##{==:##{@st_last_key},detach}' 'set -gu @st_last_key'" \; detach-client
