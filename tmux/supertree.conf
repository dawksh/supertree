# supertree bindings — sourced from ~/.tmux.conf
# Only uses keys the base config leaves free (M-arrows and S-Enter stay as-is).

bind -n M-w run-shell -b -c '#{pane_current_path}' "~/.local/bin/st go --popup '#{client_tty}'"
bind -n M-e run-shell "~/.local/bin/st toggle"
bind -n M-Tab run-shell "~/.local/bin/st last"
bind -n M-r run-shell -b "~/.local/bin/st roots --popup '#{client_tty}'"

# configurable window slots; base-index stays whatever you had
bind -n M-1 run-shell "~/.local/bin/st window 1"
bind -n M-2 run-shell "~/.local/bin/st window 2"
bind -n M-3 run-shell "~/.local/bin/st window 3"
bind -n M-4 run-shell "~/.local/bin/st window 4"
bind -n M-5 run-shell "~/.local/bin/st window 5"
bind -n M-6 run-shell "~/.local/bin/st window 6"
bind -n M-7 run-shell "~/.local/bin/st window 7"
bind -n M-8 run-shell "~/.local/bin/st window 8"
bind -n M-9 run-shell "~/.local/bin/st window 9"
bind -n M-n next-window
bind -n M-p previous-window


# which worktree am I typing into
set -g status-left ' #{?@supertree_label,#{@supertree_label},#S} '
set -g status-left-length 60

# M-q returns to the session st was opened from; M-Q always leaves tmux
bind -n M-q run-shell "~/.local/bin/st leave '#{client_tty}'"
bind -n M-Q detach-client
