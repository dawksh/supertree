name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Install tmux for integration tests
        run: |
          if ! command -v tmux >/dev/null; then
            if [ "$RUNNER_OS" = macOS ]; then
              brew install tmux
            else
              sudo apt-get update
              sudo apt-get install -y tmux
            fi
          fi
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vet and test
        run: |
          go vet ./...
          go test -race ./...
      - name: Build experimental client
        run: go build -o bin/st-next ./cmd/st-next
  test:
    name: Shell tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check shell syntax
        run: |
          bash -n dev
          for file in bin/st bin/st-lib/*.sh install.sh tests/*.sh scripts/*.sh; do
            bash -n "$file"
          done
      - name: Run tests
        run: |
          for file in tests/*.sh; do
            bash "$file"
          done
